packages:
  - packages/*
  - apps/*

minimumReleaseAge: 10080

# Note: pnpm 10.8 in this repo reads overrides from package.json's `pnpm.overrides`
# field, not this `overrides:` block (verified via the lockfile's `overrides:`
# header). The values below are kept aligned with the active overrides where
# possible, but treat this block as inactive until the precedence is resolved
# in a future cleanup. New security/version overrides should be added to
# package.json's `pnpm.overrides`.
overrides:
  bufferutil: 4.0.9
  '@tanstack/react-query': 5.59.11
  '@shopify/flash-list': 2.3.1
  '@types/react': 19.0.14
  '@types/react-dom': 19.0.6
  caniuse-lite: 1.0.30001546
  lodash: 4.18.1
  react-remove-scroll: 2.5.10
  viem: 2.39.3
  typescript: npm:@typescript/typescript6@^6.0.2
  '@solana/wallet-adapter-base': 0.9.23
  '@solana/web3.js': 1.98.0
  react-native: 0.79.4
  react-native-mmkv: 2.12.2
  query-string: 7.1.3
  lucide-react-native: 0.542.0
  react-native-svg: 15.12.1

onlyBuiltDependencies:
  - '@shopify/react-native-skia'
  - bigint-buffer
  - bufferutil
  - core-js
  - cpu-features
  - esbuild
  - keccak
  - protobufjs
  - secp256k1
  - ssh2
  - tiny-secp256k1
  - utf-8-validate

patchedDependencies:
  cipher-base: patches/cipher-base.patch
  '@react-navigation/elements': patches/@react-navigation__elements.patch
  expo-haptics: patches/expo-haptics.patch
  expo-image@55.0.10: patches/expo-image@55.0.10.patch
  react-native-draggable-flatlist: patches/react-native-draggable-flatlist.patch
  '@coinbase/wallet-mobile-sdk': patches/@coinbase__wallet-mobile-sdk.patch
  '@mattermost/react-native-paste-input': patches/@mattermost__react-native-paste-input.patch
  react-native-iap@12.16.4: patches/react-native-iap@12.16.4.patch
  lucide-react-native@0.542.0: patches/lucide-react-native@0.542.0.patch
  react-native-mmkv@2.12.2: patches/react-native-mmkv@2.12.2.patch
  react-native-webview@13.16.1: patches/react-native-webview.patch
  '@assistant-ui/eve': patches/@assistant-ui__eve.patch

syncInjectedDepsAfterScripts:
  - build
  - build:packages
  - turbo:build:packages

allowBuilds:
  sharp: false

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
