# Type and API definitions for the backend API.types
#
# Generate code from these definitions by running:
#
#   make generate

# Reusable types that are shared across multiple endpoints.types
apiTypes:
  ApiNonNegativeInteger: "Type.Integer({ $id: 'ApiNonNegativeInteger', minimum: 0 })"

  ApiPositiveInteger: "Type.Integer({ $id: 'ApiPositiveInteger', minimum: 1 })"

  ApiInteger0To100: "Type.Integer({ $id: 'ApiInteger0To100', minimum: 0, maximum: 100 })"

  ApiSearchLimit: "Type.Integer({ $id: 'ApiSearchLimit', minimum: 0, maximum: 25 })"

  ApiBase64String: "Type.String({ pattern: /^(?:[A-Za-z0-9+\/]{4})*(?:[A-Za-z0-9+\/]{4}|[A-Za-z0-9+\/]{3}=|[A-Za-z0-9+\/]{2}={2})$/.source, $id: 'ApiBase64String' })"

  ApiFarcasterAddress: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{40}$/.source, $id: 'ApiFarcasterAddress' })"

  ApiEthereumAddress: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{40}$/.source, $id: 'ApiEthereumAddress' })"

  ApiCastHash: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{40,64}$/.source, $id: 'ApiCastHash' })"

  ApiCastHashPrefix: "Type.String({ pattern: /^0[xX][0-9a-fA-F]+$/.source, $id: 'ApiCastHashPrefix' })"

  ApiEthBlockHash: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{64}$/.source, $id: 'ApiEthBlockHash' })"

  ApiEthTxHash: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{64}$/.source, $id: 'ApiEthTxHash' })"

  ApiCastReactionType: "'like' | 'Like' | 'recast'"

  ApiChain: "'ethereum' | 'base' | 'zora' | 'optimism' | 'arbitrum' | 'polygon' | 'degen' | 'base-sepolia' | 'gnosis' | 'solana' | 'abstract' | 'unichain' | 'monad-testnet' | 'celo' | 'hyperevm' | 'bsc' | 'monad' | 'robinhood'"

  ApiPaymentMethod: "'CARD' | 'APPLE_PAY'"

  ApiOnrampGuestCheckoutInfo:
    isAvailable: boolean
    limitUsd?: number
    refreshDate?: string

  ApiNftReactionType: "'Like'"

  ApiEmail: "Type.String({ pattern: /^[a-zA-Z0-9!#$%&'*+\/=?^_`{|}~-]+(?:\\.[a-zA-Z0-9!#$%&'*+\/=?^_`{|}~-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$/.source, $id: 'ApiEmail' })"

  ApiHexString: "Type.String({ pattern: /^0[xX][0-9a-fA-F]+$/.source, $id: 'ApiHexString' })"

  ApiFid: "Type.Integer({ $id: 'ApiFid', minimum: 1 })"

  ApiGroupId: "Type.String({ pattern: /^[0-9a-f]{64}$/.source, $id: 'ApiGroupId' })"

  ApiFname: "Type.String({ pattern: /^[0-9a-z][0-9a-z-]{0,15}(\\.eth|\\.base\\.eth)?$/.source, $id: 'ApiFname' })"

  ApiChannelKey: "Type.String({ pattern: /^[0-9a-z][0-9a-z-]{0,15}$/.source, $id: 'ApiChannelKey' })"

  ApiCastMention: "Type.String({ pattern: /^@([0-9a-z][0-9a-z-]{0,15}|![1-9][0-9]{20})$/.source, $id: 'ApiCastMention' })"

  ApiCastText: "Type.String({ $id: 'ApiCastText', minLength: 0 })"

  # ApiDirectCastKeyType: "'idk' | 'spk' | 'opk'"

  ApiDisplayName: "Type.String({ $id: 'ApiDisplayName', minLength: 1, maxLength: 32 })"

  ApiTimestampMillis: "Type.Integer({ $id: 'ApiTimestampMillis', minimum: 0 })"

  ApiTimestampSeconds: "Type.Integer({ $id: 'ApiTimestampSeconds', minimum: 0 })"

  ApiFarcasterNetwork: '1 | 2 | 3'

  ApiSyncChannelHash: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{128}$/.source, $id: 'ApiSyncChannelHash' })"

  ApiBase64UrlString: "Type.String({ pattern: /^(?:[A-Za-z0-9-_]{4})*(?:[A-Za-z0-9-_]{4})|[A-Za-z0-9-_]{3}$/.source, $id: 'ApiBase64UrlString' })"

  ApiVerificationToken: "Type.String({ pattern: /^0[xX][0-9a-fA-F]{64}$/.source, $id: 'ApiVerificationToken' })"

  ApiHttpsUrl: "Type.String({ pattern: /^https:\\/\\/[^\\s]+$/.source, $id: 'ApiHttpsUrl' })"

  ApiHexColor: "Type.String({ pattern: /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.source, $id: 'ApiHexColor' })"

  # DO NOT USE. This causes "Unknown format 'uuid'" errors so best to not use it.
  ApiUUID: "Type.String({ format: 'uuid', $id: 'ApiUUID' })"

  ApiChainId: "Type.Integer({ $id: 'ApiChainId', minimum: 1 })"

  ApiTotpCode: "Type.String({ $id: 'ApiTotpCode', pattern: /^[0-9]{6}$/.source, minLength: 6, maxLength: 6 })"

  ApiTotpTokenContext: "'update-email' | 'recovery'"

  # 'YYYY-MM-DD'
  ApiAnalyticsDate: "Type.String({ pattern: /^(?:[0-9]{4}-[0-9]{2}-[0-9]{2})$/.source, $id: 'ApiAnalyticsDate' })"

  # 'YYYY-MM-DD' or 'Ndaysago' or 'today'
  ApiAnalyticsDateRangeValue: "Type.String({ pattern: /^(?:[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]+daysago|today)$/.source, $id: 'ApiAnalyticsDateRangeValue' })"

  ApiCaip2Id: "Type.String({ $id: 'ApiCaip2Id', pattern: /^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$/.source, minLength: 5, maxLength: 41 })"

  ApiEmptyString: "Type.String({ pattern: /^$/.source, $id: 'ApiEmptyString' })"

  ApiExpoPushToken: "Type.String({ pattern: /^Expo(?:nent)?PushToken\\[[^\\]]+\\]$/.source, $id: 'ApiExpoPushToken' })"

  ApiSortDirection: "'asc' | 'desc'"

  ApiTokenSearchIntent: "'typeahead' | 'submit'"

  ApiError:
    message: string
    reason?: "'no_registered_fid' | 'invalid_confirm_recovery_token' | 'invalid_confirm_magic_link_token' | 'invalid_auth_token' | 'missing_registration_signer_metadata' | 'recovery_address_change_limit' | 'key_transaction_limit' | 'no_fees_found' | 'email_already_exists' | 'not_available' | 'not_available_v2' | 'missing_warpcast_signer' | 'fid_already_registered' | 'transaction_value_exceeds_limit' | 'invalid_verification_code' | 'max_verification_attempt_1d' | 'max_phone_verification_attempts_reached' | 'max_phone_verification_attempts_reached_30d' | 'no_verification_initiated' | 'number_already_claimed' | 'insufficient_warps' | 'unknown_frame_error' | 'frame_timeout' | 'invalid_frame_data' | 'frame_application_error' | 'unavailable' | 'invalid_invite_code' | 'banned_from_channel' | 'invalid_totp_token' | 'referral_blocked' | 'referral_claimed' | 'signer_already_removed' | 'invalid_username' | 'recovery_admin_signed' | 'no_fid_for_custody' | 'account_not_indexed' | 'custody_address_mismatch' | 'has_onboarding' | 'has_active_signer' | 'has_pending_signer' | 'has_revoked_signer' | 'account_banned' | 'registration_payment_required'"

  ApiWrongCustodyAddressError:
