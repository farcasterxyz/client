  # Flow, trying to stay close to the Cloudflare statuses from
  # https://developers.cloudflare.com/api/operations/stream-videos-retrieve-video-details:
  # - pending: waiting for user to upload
  #   - processing: video has been uploaded and is being processed
  #     - ready: processing is done, video is ready to serve when a cast includes it
  #       - active: video is actively being served as part of a cast
  #         - hidden: admin disabled video, but it's still on CF
  #     - failed: something failed and the video will not be served, deleted from CF (end state)
  # - abandoned: user never casted with the video (comes after 'pending' or 'ready'), deleted from CF (end state)
  # - deleted: video is gone from CF side (admin action or manually deleted), deleted from CF (end state)
  ApiVideoState: "'pending' | 'processing' | 'ready' | 'active' | 'hidden' | 'failed' | 'abandoned' | 'deleted'"

