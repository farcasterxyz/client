  ApiEnsVerificationError:
    message: string
    reason: "'ens_verification'"
    data:
      showConnectAddressLink: boolean

  ApiErrorBody: ApiError | ApiWrongCustodyAddressError | ApiFnameUnavailable | ApiEnsVerificationError | ApiTransactionWouldRevertError

  ApiErrorResponse:
    errors: ApiErrorBody[]

  ApiEnvSecretAddressEntry:
