              minNativeBuildVersionForDirectCasts: string
              minNativeAppVersionToPrompt: string
              minNativeBuildVersionToPrompt: string
              disableIAP: boolean
              disableCreateAccountIAP: boolean
              disableXVerifications: boolean
              disableNewOnboarding: boolean
              appReviewAppVersion?: string
              appReviewBuildVersion?: string
            desktop:
              minNativeAppVersion: string
              minNativeBuildVersion: string
            ios:
              minNativeAppVersion: string
              minNativeBuildVersion: string
              minNativeAppVersionForDirectCasts: string
              minNativeBuildVersionForDirectCasts: string
              minNativeAppVersionToPrompt: string
              minNativeBuildVersionToPrompt: string
              disableIAP: boolean
              disableCreateAccountIAP: boolean
              disableXVerifications: boolean
              disableNewOnboarding: boolean
              appReviewAppVersion?: string
              appReviewBuildVersion?: string

  /v2/custody-address:
    GET:
      description: Get the custody address associated with an FID.
      tags: [users]
      handler: getCustodyAddress
      query:
        fid?: ApiFid
        fname?: ApiFname
      response:
        200:
          result:
            custodyAddress: ApiFarcasterAddress

  /v2/recovery-address:
    GET:
      tags: [users]
      description: Gets the recovery address for the authenticated user
      handler: getRecoveryAddress
      response:
        200:
          result:
            recoveryAddress: ApiRecoveryAddress

    PUT:
      tags: [users]
      description: Update the authenticated user's recovery address
      handler: updateRecoveryAddress
      body:
        to: ApiEthereumAddress
        deadline: ApiTimestampSeconds
        signature: ApiHexString
      response:
        200:
          result:
            recoveryAddressChangeId: string

  /v2/recovery-address-changes:
    GET:
      tags: [users]
      description: Gets information about a recovery address change
      handler: getRecoveryAddressChange
      query:
        recoveryAddressChangeId: string
      response:
        200:
          result:
            recoveryAddressChange: ApiRecoveryAddressChange

  /v2/recovery-address-change-hash:
    GET:
      tags: [users]
      description: Gets an approval message hash for a recovery address change
      handler: getRecoveryAddressChangeHash
      query:
        to: ApiEthereumAddress
        deadline: ApiTimestampSeconds
      response:
        200:
          result:
            approveMessageHash: ApiHexString

  /v2/wallet-links:
    GET:
      description: >-
        Returns the curated list of wallet link cards shown in the wallet tab.
        Default response is the public shape (enabled rows only, minimal
        fields) regardless of caller identity. Pass `adminView=true` to
        request the admin shape (all rows including disabled, all fields);
        the request is rejected with 403 unless the caller also holds the
        `can_update_wallet_links` gate. Splitting admin behind an explicit
        query param keeps internal-team FIDs from silently receiving a
        different sort order when the mobile carousel calls this endpoint.
      tags: [private, wallets]
      handler: getWalletLinks
      query:
        adminView?: boolean
      response:
        200:
          result:
            links: ApiWalletLink[]
    POST:
      description: >-
        Create a new curated wallet link (admin only). If any of `name` /
        `description` / `imageUrl` are omitted, the server crawls the URL
        via `OpenGraphService` and populates the missing fields from
        og:title / og:description / og:image. Admin-provided values always
        win over the crawler. Crawl failures are non-fatal — the row is
        created with whatever fields the admin supplied plus an
        `ogCrawlError` note that the admin can inspect in Retool.
      tags: [private]
      handler: createWalletLink
      body:
        url: string
        name?: string
        description?: string
        imageUrl?: string
        sortOrder?: ApiNonNegativeInteger
        enabled?: boolean
      response:
        200:
          result:
            link: ApiWalletLink
    PUT:
      description: >-
        Update a curated wallet link (admin only). A new `url` re-crawls and
        overwrites the old row's cached enrichment (title / description /
        imageUrl) with the new site's values, since the old values no longer
        describe the row. `refetchOg: true` (without a URL change) busts the
        OpenGraph service's Redis cache for that URL and re-crawls, filling
        any currently-null enrichment fields but leaving values the admin
        already curated on this row untouched. A non-blank admin-provided
        `name` / `description` / `imageUrl` on this request always wins over
        the crawler; a blank (empty or whitespace-only) value is treated as
        unset, so the crawler fills it rather than the row being overwritten
        with an empty string. `refetchOg` is not persisted — pass it again on
        each request that should force a re-crawl.
      tags: [private]
      handler: updateWalletLink
      body:
        id: string
        url?: string
        name?: string
        description?: string
        imageUrl?: string
        sortOrder?: ApiNonNegativeInteger
        enabled?: boolean
        refetchOg?: boolean
      response:
        200:
          result:
            link: ApiWalletLink
    DELETE:
      description: Delete a curated wallet link (admin only)
      tags: [private]
      handler: deleteWalletLink
      body:
        id: string
      response:
        200:
          result:
            success: boolean

  # Legacy path for pre-rename mobile clients. Forwards to WalletLinksService
  # and filters out url-only rows (old clients require name/description). Delete
  # once no traffic remains from old app versions.
  /v2/defi-links:
    GET:
      description: >-
        Deprecated alias for GET /v2/wallet-links, kept for pre-rename mobile
        clients. Only returns rows with both `name` and `description` populated.
      tags: [private, wallets]
      handler: getDefiLinksShim
      response:
        200:
          result:
            links: ApiDefiLink[]

  # Start Direct Casts endpoints.

  /v2/direct-cast-conversation:
    GET:
      description: Get direct cast conversation (if authed user has access)
      tags: [private, direct casts]
      handler: getDirectCastConversation
      auth: [warpcast_auth, dc_auth]
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      query:
        conversationId: string
      response:
        200:
          result:
            conversation: ApiDirectCastConversationInfoV3

  /v2/direct-cast-inbox:
    GET:
      description: Gets the inbox conversations for the requesting user.
      tags: [private, direct casts]
      handler: getDirectCastInbox
      auth: [warpcast_auth, dc_auth]
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      query:
        category?: ApiDirectCastConversationViewCategory
        filter?: ApiDirectCastConversationFilter
      paginated: true
      response:
        200:
          result:
            hasArchived: boolean
            hasUnreadRequests: boolean
            requestsCount: number
            voidCount: number
            conversations: ApiDirectCastInboxConversationInfoV3[]

  /v2/direct-cast-conversation-list:
    GET:
      description: Gets the direct cast conversations for the requesting user.
      tags: [private, direct casts]
      handler: getDirectCastConversationsV3
      query:
