  ApiCaststormBody:
    casts: ApiCaststormCast[]
    parent?:
      hash: ApiCastHash
    channelKey?: string
    # When set, overwrite this existing draft in place instead of creating a
    # new one (upsert). Lets clients "edit a draft" without piling up
    # duplicates. Falls back to creating a new draft if it no longer exists.
    # NOTE: intentionally a bounded `string`, not ApiUUID. draft ids are ULIDs
    # stored in a uuid column (generate_ulid) and do not set RFC-4122
    # version/variant bits, so format:'uuid' validation would reject valid ids;
    # the service validates the format loosely and falls back to an insert on a
    # bad value. maxLength 36 caps the request at a canonical uuid's length
    # (a valid id is exactly 36 chars) so oversized payloads are rejected early.
    draftId?: "Type.String({ maxLength: 36 })"

