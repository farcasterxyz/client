# Defines all API endpoints.
# Endpoints are assumed to be authenticated unless otherwise specified.
routes:
  /healthcheck:
    GET:
      description: Returns whether the server is healthy and responding to requests.
      tags: [miscellaneous]
      auth: []
      handler: getHealth
      response:
        200:
          result:
            status: string

  /v1/debug/ip-info:
    GET:
      description: Returns IP address information for debugging rate limiting.
      tags: [private]
      auth: []
      handler: getIpInfo
      rateLimit:
        limit: 1
        period: 30
      response:
        200:
          result:
            requestIp: string
            trueClientIp?: string
            cfIpCountry?: string

  /v1/debug/reset-circuit-breaker:
    POST:
      description: Reset transacting account circuit breaker state for OP and Base.
      tags: [private]
      auth: []
      handler: resetAccountCircuitBreaker
      rateLimit:
        limit: 1
        period: 30
      body:
        address: ApiHexString
      response:
        200:
          result:
            success: boolean

  /v2/retool-env-secret-addresses:
    GET:
      description: Returns derived public addresses for mounted mnemonic/private-key env secrets without a paired public address env var (Retool).
      tags: [private]
      auth: [warpcast_auth]
      handler: retoolGetEnvSecretAddresses
      response:
        200:
          result:
            entries: ApiEnvSecretAddressEntry[]

  /v2/auth/step-up:
    POST:
      description: Upgrades the auth token
      tags: [auth]
      auth: [warpcast_auth]
      handler: postStepUpMessage
      body:
        message: string
        signature: ApiHexString
      response:
        200:
          result:
            success: boolean

    GET:
      description: Generates a SIWE nonce
      tags: [auth]
      auth: [warpcast_auth]
      handler: getStepUpMessage
      response:
        200:
          result:
            nonce: string

  /v2/auth:
    DELETE:
      description: Revokes an authentication token.
      tags: [auth]
      handler: deleteAuthToken
      response:
        200:
          result:
            success: boolean

  /v2/auth/sessions:
    GET:
      description: Gets active auth sessions for the authenticated user.
      tags: [auth]
      auth: [warpcast_auth]
      handler: getAuthSessions
      response:
        200:
          result:
            sessions: ApiAuthSession[]

  /v2/auth/sessions/revoke:
    PATCH:
      description: Revokes a specific auth session for the authenticated user.
      tags: [auth]
      auth: [warpcast_auth]
      handler: revokeAuthSession
      body:
        id: string
      response:
        200:
          result:
            success: boolean

  /v2/casts:
    GET:
      description: Gets all casts (including replies and recasts) created by the specified user.
      tags: [casts]
      handler: getUserCastsAndReplies
      auth: []
      query:
        fid: ApiFid
      paginated:
        max_per_page: 50
        default_per_page: 15
      omitInvalidItemsFromResult: casts
      rateLimit:
        - limit: 10
          period: 10
        - limit: 500
          period: 3600
      response:
        200:
          result:
            casts: ApiCast[]
    POST:
      description: Creates a cast for the currently authenticated user.
      tags: [casts]
      handler: createCast
      rateLimit:
        - limit: 10
          period: 60
        - limit: 100
          period: 3600
      body:
        # This is ApiCastBody but to keep backwards compatibility will have to keep the defs like this
        # instead of having a property pointing to the actual type.
        text: string
        parent?:
          hash: ApiCastHash
        embeds?: string[]
        channelKey?: string
        tokenKey?: string
        parentUrl?: string
        # Deprecated, remove in Nov
        castDistribution?: ApiCastDistribution
        clientProcessedOpenGraphMetadata?: ApiOpenGraphMetadata[]
      response:
        201:
          result:
            cast: ApiCast
    DELETE:
      description: Deletes a cast.
      tags: [casts]
      handler: deleteCast
      rateLimit:
        limit: 10
        period: 60
      body:
        castHash: ApiCastHash
      response:
        200:
          result:
            success: boolean

  /v2/recent-casts:
    GET:
      description: Get all casts in reverse chronological order.
      tags: [private, casts]
      handler: getAllRecentCasts
      rateLimit:
        - limit: 10
          period: 10
        - limit: 200
          period: 3600
      paginated:
        max_per_page: 25
        default_per_page: 10
      omitInvalidItemsFromResult: casts
      response:
        200:
          result:
            casts: ApiCast[]

  /v2/product-launch-casts:
    GET:
      description: Get product launch casts sorted by reverse chronological or algorithmic ranking.
      tags: [private, casts]
      handler: getProductLaunchCasts
      query:
        sort?: ApiProductLaunchCastsSort
      paginated:
        max_per_page: 100
        default_per_page: 25
      omitInvalidItemsFromResult: productLaunchCasts
      response:
        200:
          result:
            productLaunchCasts: ApiProductLaunchCast[]

  /v2/profile-casts:
    GET:
      description: Gets casts that are new conversations (i.e. are not replies or recasts) created by the specified user.
      tags: [private, casts]
      handler: getUserCasts
      auth: []
      query:
        fid: ApiFid
      paginated:
        max_per_page: 50
        default_per_page: 15
      omitInvalidItemsFromResult: casts
      rateLimit:
        - limit: 10
          period: 10
        - limit: 500
          period: 3600
      response:
        200:
          result:
            casts: ApiCast[]

  /v2/profile-snap-casts:
    GET:
      description: Gets snap casts created by the specified user.
      tags: [private, casts]
      handler: getProfileSnapCasts
      auth: []
      query:
        fid: ApiFid
      paginated:
        max_per_page: 50
        default_per_page: 15
      omitInvalidItemsFromResult: casts
      rateLimit:
        - limit: 10
          period: 10
        - limit: 500
          period: 3600
      response:
        200:
          result:
            casts: ApiCast[]

  /v2/user-cast:
    GET:
      description: Gets a single cast for a specific user using a shortened hash.
      tags: [casts, private]
      handler: getUserCast
      auth: []
      query:
        username: ApiFname
        hashPrefix: ApiCastHashPrefix
        scope?: string
        userAgent?: string
      response:
        200:
          result:
            cast: ApiCast

  /v2/cast-attachments:
    PUT:
      description: Uploads text to be scraped to generate a preview.
      tags: [casts, private]
      handler: processCastAttachments
      body:
        text: ApiCastText
        embeds?: string[]
      response:
        200:
          result:
            embeds?: ApiCastEmbeds

  /v2/cast-likes:
    GET:
      description: Get all like reactions for a cast.
      tags: [casts]
      handler: getCastLikes
      auth: []
      query:
        castHash: ApiCastHash
      paginated: true
      response:
        200:
          result:
            likes: ApiCastReaction[]
    PUT:
      description: Create a like reaction for a cast.
      tags: [casts]
      handler: createCastLike
      rateLimit:
        - limit: 20
          period: 20
        - limit: 200
          period: 3600
      body:
        castHash: ApiCastHash
      response:
        200:
          result:
            like: ApiCastReaction
    DELETE:
      description: Remove a reaction from a cast.
      tags: [casts]
      handler: deleteCastLike
      rateLimit:
        limit: 1
        period: 1
      body:
        castHash: ApiCastHash
      response:
        200:
          result:
            success: boolean

  /v2/cast-reactions:
    GET:
      description: Get all reactions (both likes and recasts) for a cast.
      tags: [casts]
      handler: getCastReactions
      auth: []
      query:
        castHash: ApiCastHash
      paginated: true
      response:
        200:
          result:
            reactions: ApiCastReaction[]

  /v2/cast-recasters:
    GET:
      description: Get all users who recasted a cast.
      tags: [casts]
      handler: getCastRecasters
      auth: []
      query:
        castHash: ApiCastHash
      paginated: true
      response:
        200:
          result:
            users: ApiUser[]

  /v2/cast-quotes:
    GET:
      description: Get all quotes of a cast.
      tags: [casts]
      handler: getCastQuotes
      query:
        castHash: ApiCastHash
      paginated: true
      response:
        200:
          result:
            quotes: ApiCast[]

  /v2/cast-collectibles:
    POST:
      description: Get live state of cast collectibles.
      tags: [casts]
      handler: getCastCollectibles
      body:
        castHashes: ApiCastHash[]
      response:
        200:
          result:
            collectibles: ApiCastCollectible[]
    GET:
      description: Get live state of a cast collectible.
      tags: [casts]
      handler: getCastCollectible
      query:
        castHash: ApiCastHash
        refresh?: boolean
      response:
        200:
          result:
            collectible: ApiCastCollectible

  /v2/cast-collectibles/bid-history:
    GET:
      description: Get bid history for a cast collectible.
      tags: [casts]
      handler: getCastCollectibleBidHistory
      query:
        castHash: ApiCastHash
      response:
        200:
          result:
            bids: ApiCastCollectibleAuctionBid[]

  /v2/watch-cast-collectible:
    PUT:
      description: Unwatch an unavailable cast collectible
      tags: [casts]
      handler: watchCastCollectible
      rateLimit:
        - limit: 30
          period: 60
        - limit: 600
          period: 86400
      body:
        castHash: ApiCastHash
      response:
        200:
          result:
            success: boolean

    DELETE:
      description: Unwatch a cast collectible
      tags: [casts]
      handler: unwatchCastCollectible
      rateLimit:
        - limit: 30
          period: 60
        - limit: 600
          period: 86400
      body:
        castHash: ApiCastHash
      response:
        200:
          result:
            success: boolean

  /v2/cast-collectibles-index:
    GET:
      description: Lists of cast collectibles
      tags: [casts]
      handler: getCastCollectiblesIndex
      rateLimit:
        limit: 60
        period: 60
      paginated: true
      query:
        key: ApiCollectibleCastsIndexKey
        expiringSoon?: boolean
        expiring24h?: boolean
        following?: boolean
        sortCci?: ApiCollectibleCastsIndexSort
        sortKey?: ApiCollectibleCastsIndexSortKey
        sortDirection?: ApiSortDirection
      response:
        200:
          result:
            casts: ApiCast[]

  /v2/explore-cast-collectibles:
    GET:
      description: Explore bid on cast collectibles for a user.
      rateLimit:
        limit: 20
        period: 60
      tags: [casts]
      handler: exploreCastCollectibles
      response:
        200:
          result:
            casts: ApiCast[]

  /v2/cast-collectibles/place-bid:
    POST:
      description: Bid on a cast collectible.
      tags: [casts]
      handler: bidOnCastCollectible
      rateLimit:
        - limit: 20
          period: 60
        - limit: 2000
          period: 86400
      body:
        castHash: ApiCastHash
        bidderAddress: ApiEthereumAddress
        bidAmount: string
        permit?:
          deadline: ApiTimestampSeconds
          signature: ApiHexString
      response:
        200:
          result:
            transaction: ApiEthSendTransactionRequest

  /v2/cast-collectibles/collection:
    GET:
      description: Get a user's collection of casts.
      tags: [casts]
      handler: getUserCastCollectibles
      rateLimit:
        limit: 20
        period: 60
      query:
        fid: ApiFid
      response:
        200:
          result:
            bids: ApiCast[]
            owned: ApiCast[]

  /v2/cast-collectibles/background-image:
    GET:
      description: Generates an collectible cast background image
      tags: [casts]
      auth: []
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      handler: getCastCollectibleBackgroundImage
      query:
        castHash: ApiCastHash
      response: any # Returns a PNG image

  /v2/cast-collectibles/artifact:
    GET:
      description: Generates a cast collectible artifact image
      tags: [casts]
      auth: []
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      handler: getCastCollectibleArtifact
      query:
        castHash: ApiCastHash
        resolution?: ApiCastCollectibleArtifactResolution
        variant?: ApiCastCollectibleArtifactVariant
      response: any # Returns a PNG image

  /v2/cast-collectibles/thumbnail:
    GET:
      description: Returns a thumbnail image for a cast collectible
      tags: [casts]
      auth: []
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      handler: getCastCollectibleThumbnail
      query:
        castHash: ApiCastHash
      response: any # Returns a PNG image

  /v2/cast-collectibles/image:
    GET:
      description: Returns a full cast collectible image
      tags: [casts]
      auth: []
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      handler: getCastCollectibleImage
      query:
        castHash: ApiCastHash
      response: any # Returns a PNG image

  /v2/cast-collectibles/metadata:
    GET:
      description: Get metadata for cast collectibles. Use id="contract" for contract metadata or a tokenId for token metadata.
      tags: [casts]
      auth: []
      corp: false # Set Cross-Origin-Resource-Policy to cross-origin to allow loading from other clients
      handler: getCastCollectiblesMetadata
      query:
        id: string
        v?: number
      response: any # Returns contract metadata or NFT metadata JSON

  /v2/client-config:
